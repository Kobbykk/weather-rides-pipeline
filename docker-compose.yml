services:
  postgres:
    image: postgres:16
    container_name: rides_postgres
    env_file: .env
    networks:
      - data_net
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  data_net:
    external: true